        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;

        <title>UNTREF LINGUA - Idiomas por Localidad</title>

        <!--Logo para pestañas browser-->
        <link rel="icon" type = "image/png"  href="images/untref_lingua_LOGO.png">

    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <!-- Selector de Idiomas -->
        <div id = "language-selector" style = "position:absolute; top: 10px; right: 60px; z-index: 1000; background:white; padding: 8px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);">
            <label for="languageSelect">Seleccione Idioma a representar:</label>
            <select id="languageSelect">
                <option value="">-- Seleccione Idioma --</option>
                <option value="De">Alemán</option>
                <option value="Ar">Árabe</option>
                <option value="Ay">Aymara</option>
                <option value="Cmn">Chino (Mandarín)</option>
                <option value="Fr">Francés</option>
                <option value="Gn">Guaraní</option>
                <option value="En">Inglés</option>
                <option value="It">Italiano</option>
                <option value="Arn">Mapundungún</option>
                <option value="Pt">Portugués</option>
                <option value="Qu">Quechua</option>
                <option value="Tob">Toba (Qom)</option>
                <option value="Wch">Wichí</option>
            </select>
        </div>

        <div id="languageLegendContainer" style="position: absolute; bottom: 25px; right: 15px;">
            <img id="legend_Wch" src="images/ref_IdiomaWichi_1.png" style="display: none;">
            <img id="legend_Tob" src="images/ref_IdiomaTobaQom_2.png" style="display: none;">
            <img id="legend_Qu" src="images/ref_IdiomaQuechua_3.png" style="display: none;">
            <img id="legend_Pt" src="images/ref_IdiomaPortugues_4.png" style="display: none;">
            <img id="legend_It" src="images/ref_IdiomaItaliano_5.png" style="display: none;">
            <img id="legend_Gu" src="images/ref_IdiomaGuarani_6.png" style="display: none;">
            <img id="legend_Fr" src="images/ref_IdiomaFrances_7.png" style="display: none;">
            <img id="legend_En" src="images/ref_IdiomaIngles_8.png" style="display: none;">
            <img id="legend_De" src="images/ref_IdiomaAleman_9.png" style="display: none;">
            <img id="legend_Cmn" src="images/ref_IdiomaChinoMandarin_10.png" style="display: none;">
            <img id="legend_Ay" src="images/ref_IdiomaAymara_11.png" style="display: none;">
            <img id="legend_Arn" src="images/ref_IdiomaMapundungun_12.png" style="display: none;">
            <img id="legend_Ar" src="images/ref_IdiomaArabe_13.png" style="display: none;">
        </div>
